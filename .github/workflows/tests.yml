name: Build and Test

#FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true


on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          zig-version: 0.17.0-dev.702+18b3c78a9

      - name: Build
        run: zig build -Drelease-safe=true

      - name: Make test script executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x tests/run-tests.sh
       
      - name: Run zig tests
        run: zig test -fsingle-threaded src/zig/all_tests.zig

      - name: Run full test suite (Bash)
        shell: bash
        run: ./run_tests.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zig-build-${{ matrix.os }}
          path: zig-out/bin/

